name: Morning Briefing

on:
  schedule:
    # 05:45 UTC = 05:45 Ghana local time (UTC+0), before the morning rush.
    # Second run at 17:45 so anyone who subscribes during the day (e.g. a
    # hackathon judge) still gets a real briefing within ~12 hours.
    - cron: "45 5 * * *"
    - cron: "45 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Serialize against alert_and_poll / fires, which push the same branch;
# concurrent rebase+push races caused failed commits.
concurrency:
  group: data-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests numpy

      - name: Send morning briefings
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python push_engine.py briefing

      - name: Broadcast city briefing to ntfy topic
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: python push_engine.py broadcast

      - name: Commit subscriber state changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # subscribers.json is intentionally NOT committed: it contains
          # Telegram chat_ids and is .gitignore'd (privacy).
          git add bot_state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update push state after morning briefing [skip ci]"
          fi
          # Rebase-and-retry: the alert/fires workflows push to the same
          # branch. -X theirs keeps this run's fresh state on conflicts.
          for attempt in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME"
            if ! git rebase -X theirs "origin/$GITHUB_REF_NAME"; then
              git rebase --abort
              echo "rebase could not auto-resolve; failing loudly"
              exit 1
            fi
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            echo "push rejected, retrying ($attempt/5)"
            sleep $((attempt * 5))
          done
          echo "push rejected after 5 attempts"
          exit 1

name: FIRMS Fire Detections

on:
  schedule:
    # every 6 hours; FIRMS NRT updates a few times per day
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fires:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch VIIRS fire detections
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        # A failed fetch keeps the previous data/fires_ghana.json untouched,
        # so a red cross here adds noise without protecting anything.
        continue-on-error: true
        run: python fetch_fires.py

      - name: Commit fires_ghana.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fires_ghana.json
          if ! git diff --cached --quiet; then
            git commit -m "fires_ghana.json [skip ci]"
          fi
          # Rebase-and-retry: alert_and_poll runs at :22, one minute before
          # this job's :23 — pushes must tolerate landing mid-cycle.
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            if git rebase -X theirs "origin/$GITHUB_REF_NAME"; then
              git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            else
              git rebase --abort
              echo "rebase could not auto-resolve; failing loudly"
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "push rejected after 3 attempts"
          exit 1

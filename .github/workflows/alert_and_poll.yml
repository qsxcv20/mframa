name: Alerts and Bot Poll

on:
  schedule:
    # every 15 minutes, offset from the top of the hour
    - cron: "7-57/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poll-and-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests numpy

      - name: Process bot commands (getUpdates)
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python push_engine.py poll

      - name: Check alert thresholds
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python push_engine.py alerts

      - name: Commit state changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # subscribers.json is intentionally NOT committed: it contains
          # Telegram chat_ids and is .gitignore'd (privacy).
          git add bot_state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update push state after alert/poll cycle [skip ci]"
          fi
          # Rebase-and-retry: the fires/morning-briefing workflows push to the
          # same branch. -X theirs keeps this run's freshly computed state on
          # content conflicts; retry covers a push landing mid-rebase.
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            if git rebase -X theirs "origin/$GITHUB_REF_NAME"; then
              git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            else
              git rebase --abort
              echo "rebase could not auto-resolve; failing loudly"
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "push rejected after 3 attempts"
          exit 1

      - name: Publish PM2.5 field JSON
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: python publish_field.py

      - name: Refresh offline snapshot (~hourly; every 4th run to bound API load)
        if: ${{ github.run_number % 4 == 1 }}
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        continue-on-error: true
        run: python fetch_snapshot.py

      - name: Commit field.json and snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/field.json data/snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "field.json + snapshot [skip ci]"
          fi
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            if git rebase -X theirs "origin/$GITHUB_REF_NAME"; then
              git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            else
              git rebase --abort
              echo "rebase could not auto-resolve; failing loudly"
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "push rejected after 3 attempts"
          exit 1
